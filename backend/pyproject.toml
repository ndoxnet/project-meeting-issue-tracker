# Concept by MrHan (08974747477)
[project]
name = "project-meeting-issue-tracker-backend"
version = "0.2.0"
description = "Backend API for the Project Meeting Issue Tracker"
requires-python = ">=3.12"
# Versions pinned to compatible minor ranges (upper-bounded to avoid surprise
# breaking majors) and validated against Python 3.12.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "PyJWT>=2.8,<3.0",
    "python-multipart>=0.0.9,<0.1",
    "email-validator>=2.1,<3.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.28",
    "aiosqlite>=0.20,<0.21",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are generated; do not lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real PostgreSQL instance (not run on the VPS)",
]

# Pin rationale:
#  - pwdlib[argon2]: chosen hashing lib (ADR-008); argon2 extra pulls argon2-cffi.
#  - PyJWT <3: stable HS256 API (ADR-009); avoids python-jose.
#  - sqlalchemy[asyncio] >=2.0.30: mature async + typed 2.x mapping.
#  - aiosqlite: dev/test only, in-memory async DB for fast unit/API tests.
# No frontend lockfile is created on the VPS (ADR-004). A backend lockfile is
# intentionally omitted for Phase 2A; pins above bound the resolution.
