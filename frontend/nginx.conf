# Concept by MrHan (08974747477)
# Frontend runtime Nginx: serve the static SPA and reverse-proxy /api to the
# backend container. Listens on 8080 so it can run as a non-root user.

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Writable temp paths for non-root operation.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Upload cap should match backend ATTACHMENT_MAX_MB (adjust at deploy time).
    client_max_body_size 12m;

    # gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;                 # never list directories

        # Baseline security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Container-local liveness endpoint for healthcheck.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Proxy API calls to the backend (internal Docker network only — the
        # backend port is never exposed publicly). Preserve/forward the request id.
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $http_x_request_id;
            proxy_pass_request_headers on;
        }

        # Long-cache fingerprinted build assets (Vite emits hashed filenames).
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA history fallback (index.html itself is not cached).
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
